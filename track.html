<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your order — Enigma Perfumes</title>
<meta name="description" content="Check the status of your Enigma Perfumes order.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="enigma.css?v=3">
<link rel="stylesheet" href="ep.css?v=6">
<link rel="stylesheet" href="ep-chrome.css?v=6">
</head>
<body data-page="track" data-mode="all">
<div id="epHeader"></div>
<div class="page-head"><div class="wrap"><div class="breadcrumb"><a href="index.html">Home</a> / <span>Track your order</span></div><h1>Track your order</h1></div></div>
<main class="wrap">
<div class="prose" style="max-width:560px">
  <p>Enter your order number and the phone number you ordered with.</p>
  <form id="trk" class="form-card" novalidate>
    <label>Order number<input id="trkNo" type="text" placeholder="EP-00012" autocomplete="off" autocapitalize="characters" required></label>
    <label>Phone number<input id="trkPh" type="tel" inputmode="tel" placeholder="10-digit mobile number" autocomplete="tel" required></label>
    <button type="submit" class="btn-seal" id="trkBtn">Track order</button>
  </form>
  <div id="trkOut" aria-live="polite"></div>
  <p class="muted">Cannot find your order? Message us on <a href="https://wa.me/917982410620" target="_blank" rel="noopener">WhatsApp</a> with your order number.</p>
</div>
</main>
<div id="epFooter"></div>
<script src="ep-config.js?v=1"></script>
<script src="store.js?v=6"></script>
<script src="ep-chrome.js?v=9"></script>
<script src="ep-ui.js?v=9"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), out = $("trkOut");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const STEPS = ["Order placed", "Confirmed", "Packed", "Shipped", "Delivered"];
  function stepOf(st){
    st = String(st || "").toLowerCase();
    if(/cancel/.test(st)) return -1;
    if(/deliver/.test(st)) return 4; if(/ship|dispatch/.test(st)) return 3; if(/pack/.test(st)) return 2; if(/confirm|paid/.test(st)) return 1;
    return 0;
  }
  function render(r){
    const i = stepOf(r.status), cancelled = i < 0;
    const items = String(r.items || "").split(";").map(s => s.trim()).filter(Boolean).map(s => "<li>" + esc(s) + "</li>").join("");
    const steps = cancelled ? '<p class="trk-cancel">This order was cancelled. Message us on WhatsApp if you have questions.</p>'
      : '<ol class="trk-steps">' + STEPS.map((s, n) => '<li class="' + (n < i ? "done" : n === i ? "now" : "") + '"><span></span>' + s + '</li>').join("") + "</ol>";
    const wait = !cancelled && i === 0 ? '<p class="muted">We are checking your payment. You will get a confirmation on WhatsApp.</p>' : "";
    const link = /^https?:\/\//i.test(r.trackingUrl || "") ? ' <a href="' + esc(r.trackingUrl) + '" target="_blank" rel="noopener">Track parcel</a>' : "";
    const ship = (r.courier || r.trackingNo) ? '<p><b>Courier:</b> ' + esc(r.courier || "-") + (r.trackingNo ? " &middot; <b>Tracking no.:</b> " + esc(r.trackingNo) : "") + link + "</p>" : "";
    out.innerHTML = '<div class="form-card"><h3 style="margin:0 0 4px">' + esc(r.order) + '</h3><p class="muted" style="margin:0 0 12px">' + (r.date ? "Placed " + esc(r.date) : "") + '</p>' + steps + wait + ship +
      (items ? '<ul class="trk-items">' + items + "</ul>" : "") + (r.total ? '<p><b>Total:</b> ₹' + Number(r.total).toLocaleString("en-IN") + "</p>" : "") + "</div>";
  }
  try{ const l = JSON.parse(localStorage.getItem("ep_last_order") || "null"); if(l){ $("trkNo").value = l.no || ""; $("trkPh").value = String(l.phone || "").replace(/\D/g, "").slice(-10); } }catch(e){}
  const q = new URLSearchParams(location.search); if(q.get("order")) $("trkNo").value = q.get("order");
  $("trk").addEventListener("submit", async e => {
    e.preventDefault();
    const url = window.EP_CONFIG && window.EP_CONFIG.ordersUrl;
    if(!url){ out.innerHTML = '<p class="trk-cancel">Order tracking is not switched on yet. Please message us on WhatsApp with your order number.</p>'; return; }
    const no = $("trkNo").value.trim(), ph = $("trkPh").value.replace(/\D/g, "");
    if(!no || ph.length < 10){ out.innerHTML = '<p class="trk-cancel">Enter your order number and a 10-digit phone number.</p>'; return; }
    $("trkBtn").disabled = true; out.innerHTML = '<p class="muted">Looking up your order...</p>';
    try{
      const r = await (await fetch(url + "?action=track&order=" + encodeURIComponent(no) + "&phone=" + encodeURIComponent(ph))).json();
      if(r.ok) render(r); else out.innerHTML = '<p class="trk-cancel">' + esc(r.error || "We could not find that order.") + "</p>";
    }catch(err){ out.innerHTML = '<p class="trk-cancel">Could not reach the order system. Please try again in a minute, or message us on WhatsApp.</p>'; }
    $("trkBtn").disabled = false;
  });
})();
</script>

</body>

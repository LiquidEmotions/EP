<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist — Enigma Perfumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ECE8F1; --ink-deep:#211A33; --parchment:#211A33; --parchment-dim:#5B5470;
    --amber:#A64A66; --amber-bright:#8B1E3F; --brass:#A64A66; --line:rgba(91,84,112,0.35);
    --moss:#FFFFFF; --burgundy:#211A33; --radius:2px; --blush:#CDC6DA; --taupe:#5B5470;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--ink); color:var(--parchment); font-family:'Source Serif 4', serif; font-size:17px; line-height:1.55; overflow-x:hidden;}
  h1,h2,h3,.display{font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em;}
  a{color:inherit;}
  /* ---------- Background: champagne gold + light rose gold (static, minimal) ---------- */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      linear-gradient(115deg, transparent 38%, rgba(255,255,255,0.55) 50%, transparent 62%),
      radial-gradient(1100px 720px at 0% 0%, rgba(233,212,160,0.42), transparent 62%),
      radial-gradient(1000px 760px at 100% 100%, rgba(232,184,166,0.36), transparent 62%),
      linear-gradient(160deg, #FBF8F0 0%, #ECE8F1 50%, #F9EEE9 100%);
  }
  img,svg{display:block;max-width:100%;}
  button, input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--amber-bright); outline-offset:3px;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 28px;}
  header{position:sticky; top:0; z-index:20; background:rgba(250,246,242,0.85); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:18px 28px;}
  .wordmark{font-size:1.15rem; display:flex; align-items:baseline; gap:8px; text-decoration:none;}
  .wordmark .mono{font-size:0.62rem; color:var(--amber-bright); letter-spacing:0.14em;}
  nav.links{display:flex; gap:26px; font-size:0.85rem;}
  nav.links a{text-decoration:none; color:var(--parchment-dim); border-bottom:1px solid transparent; padding-bottom:2px; transition:color .2s, border-color .2s;}
  nav.links a:hover{color:var(--parchment); border-color:var(--amber);}
  .cart-pill{display:flex; align-items:center; gap:8px; font-size:0.78rem; padding:9px 16px; border:1px solid var(--brass); color:var(--amber-bright); border-radius:var(--radius); text-decoration:none; white-space:nowrap;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .hamburger-btn{
    display:none; flex-direction:column; justify-content:center; gap:4px;
    width:32px; height:32px; background:none; border:none; cursor:pointer; padding:0;
  }
  .hamburger-btn span{display:block; width:100%; height:2px; background:var(--parchment); border-radius:2px;}
  .mobile-menu{
    display:none; flex-direction:column;
    border-top:1px solid var(--line);
    background:var(--ink);
    padding:6px 28px 14px;
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu a{
    text-decoration:none; color:var(--parchment-dim);
    padding:13px 0; border-bottom:1px solid var(--line);
    font-size:0.9rem;
  }
  .mobile-menu a:last-child{border-bottom:none;}
  .mobile-menu a:hover{color:var(--amber-bright);}
  .cart-pill:hover{background:var(--amber); color:var(--ink-deep); border-color:var(--amber);}
  .cart-pill.active{background:rgba(139,30,63,0.1);}
  .cart-count{background:var(--amber-bright); color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:0.66rem; font-weight:600; padding:1px 6px; border-radius:100px;}
  .cart-pill:hover .cart-count{background:var(--ink-deep); color:var(--amber);}
  .page-head{padding:56px 28px 36px; border-bottom:1px solid var(--line);}
  .breadcrumb{font-size:0.7rem; color:var(--parchment-dim); margin-bottom:18px;}
  .breadcrumb a{text-decoration:none; color:var(--parchment-dim);}
  .breadcrumb a:hover{color:var(--amber-bright);}
  .page-head h1{font-size:clamp(1.9rem, 4vw, 2.6rem); margin:0 0 6px;}
  .page-head .sub{color:var(--parchment-dim); font-size:0.92rem;}
  main{padding:52px 28px 100px;}
  .cart-layout{display:grid; grid-template-columns:1.7fr 1fr; gap:56px; align-items:start;}
  .line-list{display:flex; flex-direction:column;}
  .line-item{display:grid; grid-template-columns:64px 1fr; gap:22px; padding:26px 0; border-bottom:1px solid var(--line);}
  .line-item:first-child{padding-top:0;}
  .vial{width:56px;}
  .liquid-fill{transition:height .3s ease, y .3s ease;}
  .li-main{min-width:0;}
  .li-house{font-size:0.66rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--parchment-dim);}
  .li-name{font-size:1.25rem; margin:4px 0 8px;}
  .li-notes{font-size:0.78rem; color:var(--parchment-dim); margin-bottom:16px;}
  .li-controls{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .li-remove{background:none; border:none; color:var(--parchment-dim); font-size:0.72rem; text-decoration:underline; text-underline-offset:3px; padding:0;}
  .li-remove:hover{color:#B23B2E;}
  .soldout-badge{display:inline-block; vertical-align:middle; margin-left:6px; font-family:'IBM Plex Mono', monospace; font-size:0.62rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#fff; background:#8B1E3F; padding:3px 9px; border-radius:100px;}
  .size-table{display:flex; flex-direction:column; border-top:1px solid var(--line);}
  .size-table-row{display:flex; align-items:center; justify-content:space-between; width:100%; border-bottom:1px solid var(--line); padding:10px 2px; color:var(--parchment); font-size:0.85rem;}
  .size-table-row:last-child{border-bottom:none;}
  .size-table-right{display:flex; align-items:center; gap:12px;}
  .size-table-size{color:var(--parchment-dim);}
  .size-table-price{color:var(--amber-bright); font-size:0.92rem; font-weight:600; min-width:52px; text-align:right;}
  .empty-state{padding:60px 0; text-align:center; border-bottom:1px solid var(--line);}
  .empty-state .vial{margin:0 auto 22px;}
  .empty-state h3{font-size:1.3rem; margin:0 0 10px;}
  .empty-state p{color:var(--parchment-dim); font-size:0.9rem; margin:0 0 26px;}
  .summary{background:var(--moss); border:1px solid var(--line); border-radius:var(--radius); padding:28px 26px; position:sticky; top:100px;}
  .summary h2{font-size:1.15rem; margin:0 0 22px;}
  .summary-row{display:flex; justify-content:space-between; font-size:0.88rem; color:var(--parchment-dim); padding:10px 0;}
  .btn-primary{display:block; width:100%; text-align:center; background:var(--amber); color:var(--ink-deep); border:1px solid var(--amber); padding:15px 22px; font-size:0.9rem; border-radius:var(--radius); text-decoration:none; font-weight:600; margin-top:10px; cursor:pointer;}
  .btn-primary:hover{background:var(--amber-bright); border-color:var(--amber-bright); color:var(--ink);}
  .btn-primary:disabled{opacity:0.4; pointer-events:none;}
  .btn-secondary{display:block; width:100%; text-align:center; background:transparent; color:var(--parchment-dim); border:1px solid var(--line); padding:12px 22px; font-size:0.82rem; border-radius:var(--radius); margin-top:10px; cursor:pointer;}
  .btn-secondary:hover{border-color:#B23B2E; color:#B23B2E;}
  .note-line{font-size:0.7rem; color:var(--parchment-dim); text-align:center; margin-top:14px;}
  .continue-link{display:block; text-align:center; margin-top:16px; font-size:0.78rem; color:var(--parchment-dim); text-decoration:none;}
  .continue-link:hover{color:var(--amber-bright);}
  footer{border-top:1px solid var(--line); padding:44px 28px 36px;}
  .footer-grid{display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px; font-size:0.8rem; color:var(--parchment-dim);}
  .recently-viewed{padding:44px 28px; border-top:1px solid var(--line);}
  .recently-viewed h2{font-size:1.15rem; margin:0 0 20px;}
  .rv-grid{display:flex; gap:16px; overflow-x:auto; padding-bottom:6px;}
  .rv-card{flex-shrink:0; width:120px; cursor:pointer;}
  .rv-swatch{width:100%; aspect-ratio:1; border-radius:var(--radius); border:1px solid var(--line);}
  .rv-house{font-size:0.62rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--parchment-dim); margin-top:8px;}
  .rv-name{font-size:0.85rem; margin-top:2px;}
  .rv-card:hover .rv-name{color:var(--amber-bright);}
  @media (max-width: 880px){ .cart-layout{grid-template-columns:1fr;} .summary{position:static;} }
  @media (max-width: 560px){
    nav.links{display:none;}
    .hamburger-btn{display:flex;}
    .line-item{grid-template-columns:48px 1fr;}
  }  .wa-float{
    position:fixed; bottom:24px; right:24px; z-index:50;
    width:56px; height:56px; border-radius:50%;
    background:#25D366; color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(33,26,51,0.3);
    text-decoration:none;
    transition:transform .15s ease;
  }
  .wa-float:hover{transform:scale(1.07);}
  .wa-float svg{width:28px; height:28px; display:block;}
  @media (max-width:620px){
    .wa-float{bottom:18px; right:18px; width:50px; height:50px;}
    .wa-float svg{width:25px; height:25px;}
  }
  @media (max-width:480px){
    .nav{padding:14px 16px; gap:8px;}
    .wordmark .mono{display:none;}
    .wordmark{font-size:1rem;}
    .cart-pill{padding:8px 10px;}
    .pill-label{display:none;}
  }
</style>

</head>
<body data-page="wishlist">

<div id="epHeader"></div>

<div class="page-head">
  <div class="wrap">
    <div class="breadcrumb"><a href="shop.html">Catalogue</a> / <span>Wishlist</span></div>
    <h1>Your wishlist</h1>
    <p class="sub" id="subCopy">Fragrances you're keeping an eye on.</p>
  </div>
</div>

<main class="wrap">
  <div class="cart-layout">
    <div>
      <div class="line-list" id="wishList"></div>
      <a class="continue-link" href="shop.html" style="text-align:left; margin-top:22px; display:inline-block;">← Continue browsing the catalogue</a>
    </div>

    <aside class="summary">
      <h2>Wishlist</h2>
      <div class="summary-row">
        <span id="wishCountLabel">0 saved</span>
      </div>
      <button class="btn-primary" id="addAllBtn">Add all to cart</button>
      <button class="btn-secondary" id="clearWishlistBtn">Clear wishlist</button>
      <p class="note-line">Saved items stay here on this browser, so they'll be waiting whenever you're ready.</p>
    </aside>
  </div>
</main>

<section class="recently-viewed" id="recentlyViewed" style="display:none;">
  <div class="wrap">
    <h2>Recently viewed</h2>
    <div class="rv-grid" id="rvGrid"></div>
  </div>
</section>

<div id="epFooter"></div>

<script src="store.js?v=3"></script>
<script src="ep-chrome.js?v=3"></script>
<script>
const FILL_LEVEL = { "3ml": 28, "5ml": 40, "10ml": 62, "20ml": 92, "30ml": 100 };

function vialSVG(id, color, size){
  const fill = FILL_LEVEL[size] || FILL_LEVEL["10ml"];
  const y = 190 - (fill / 100) * 180;
  const clipId = "clip-wish-" + id;
  return `
  <svg class="vial" viewBox="0 0 100 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M38 10 H62 V38 C62 42 66 44 72 52 C82 64 84 78 84 100 V172 C84 182 76 190 66 190 H34 C24 190 16 182 16 172 V100 C16 78 18 64 28 52 C34 44 38 42 38 38 Z"
          stroke="#A64A66" stroke-width="3"/>
    <clipPath id="${clipId}">
      <path d="M38 10 H62 V38 C62 42 66 44 72 52 C82 64 84 78 84 100 V172 C84 182 76 190 66 190 H34 C24 190 16 182 16 172 V100 C16 78 18 64 28 52 C34 44 38 42 38 38 Z"/>
    </clipPath>
    <g clip-path="url(#${clipId})">
      <rect class="liquid-fill" x="10" y="${y}" width="84" height="200" fill="${color}"/>
    </g>
    <rect x="34" y="2" width="32" height="8" rx="2" fill="#A64A66"/>
  </svg>`;
}

function currency(n){ return leFormatPrice(n); }

window.addEventListener("le-data-updated", () => { render(); });

function renderEmpty(){
  const list = document.getElementById("wishList");
  list.innerHTML = `
    <div class="empty-state">
      ${vialSVG("empty", "#121316", "5ml").replace('class="vial"','class="vial" style="width:56px;margin:0 auto;"')}
      <h3>Your wishlist is empty</h3>
      <p>Tap the heart on any fragrance to save it here for later.</p>
      <a class="btn-primary" href="shop.html" style="display:inline-block; width:auto; margin-top:0;">Browse the catalogue</a>
    </div>`;
}

const hamburgerBtn = document.getElementById("hamburgerBtn");
const mobileMenu = document.getElementById("mobileMenu");
if(hamburgerBtn && mobileMenu){
  hamburgerBtn.addEventListener("click", () => {
    const isOpen = mobileMenu.classList.toggle("open");
    hamburgerBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  mobileMenu.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      mobileMenu.classList.remove("open");
      hamburgerBtn.setAttribute("aria-expanded", "false");
    });
  });
}

function render(){
  const items = leWishlistItems();
  const list = document.getElementById("wishList");
  const sub = document.getElementById("subCopy");
  const addAllBtn = document.getElementById("addAllBtn");
  const clearBtn = document.getElementById("clearWishlistBtn");

  if(items.length === 0){
    renderEmpty();
    addAllBtn.disabled = true;
    clearBtn.style.display = "none";
  } else {
    addAllBtn.disabled = false;
    clearBtn.style.display = "";

    list.innerHTML = items.map(f => {
      const sizes = Object.keys(f.prices);
      return `
      <div class="line-item" data-id="${f.id}">
        <div class="vial-slot"${f.soldOut ? ' style="opacity:.45;filter:grayscale(.6);"' : ""}>${f.image
          ? `<img src="${f.image}" alt="${f.name}" style="width:56px;height:80px;object-fit:contain;border-radius:6px;">`
          : vialSVG(f.id, f.color, sizes[0])}</div>
        <div class="li-main">
          <div class="li-house">${f.house}</div>
          <h3 class="li-name">${f.name}${f.soldOut ? ` <span class="soldout-badge">Sold out</span>` : ""}</h3>
          <div class="li-notes">${[f.notes.all, f.notes.top, f.notes.heart, f.notes.base].filter(Boolean).join(" · ")}</div>
          <div class="li-controls">
            <button class="li-remove">Remove from wishlist</button>
          </div>
          <div class="size-table">
            ${sizes.map(s => `
              <div class="size-table-row" data-size="${s}">
                <span class="size-table-size">${leSizeLabel(s)}</span>
                <div class="size-table-right">
                  <span class="size-table-price mono"${leIsSoldOut(f.id, s) ? ' style="color:var(--parchment-dim);font-size:0.72rem;text-transform:uppercase;letter-spacing:.04em;"' : ""}>${leIsSoldOut(f.id, s) ? "Sold out" : currency(f.prices[s])}</span>
                  <span class="le-card-qty-slot" data-size="${s}"></span>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  sub.textContent = items.length === 0
    ? "Nothing saved yet."
    : `${items.length} fragrance${items.length === 1 ? "" : "s"} you're keeping an eye on.`;
  document.getElementById("wishCountLabel").textContent = items.length === 1 ? "1 saved" : `${items.length} saved`;

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll(".line-item").forEach(row => {
    const id = row.dataset.id;

    row.querySelectorAll(".le-card-qty-slot").forEach(slot => {
      leWireQtyControl(slot, id, slot.dataset.size, "dark");
    });

    row.querySelector(".li-remove").addEventListener("click", () => {
      leToggleWishlist(id);
      render();
    });
  });
}

document.getElementById("addAllBtn").addEventListener("click", () => {
  const items = leWishlistItems();
  items.forEach(f => {
    const sz = Object.keys(f.prices).find(s => !leIsSoldOut(f.id, s) && leSizeKind(s) === "decant") || Object.keys(f.prices).find(s => !leIsSoldOut(f.id, s));
    if(sz) leAddToCart(f.id, sz, 1);
  });
  render();
});

document.getElementById("clearWishlistBtn").addEventListener("click", () => {
  leWishlistItems().forEach(f => leToggleWishlist(f.id));
  render();
});

function renderRecentlyViewed(){
  const section = document.getElementById("recentlyViewed");
  const grid = document.getElementById("rvGrid");
  const items = leGetRecentlyViewed(6);
  if(!items.length){
    section.style.display = "none";
    return;
  }
  section.style.display = "block";
  grid.innerHTML = items.map(f => `
    <div class="rv-card" data-id="${f.id}">
      <div class="rv-swatch" style="${f.image ? `background-image:url('${f.image}');background-size:contain;background-repeat:no-repeat;background-position:center;` : `background:${f.color};`}"></div>
      <div class="rv-house mono">${f.house}</div>
      <div class="rv-name">${f.name}</div>
    </div>
  `).join("");
  grid.querySelectorAll(".rv-card").forEach(card => {
    card.addEventListener("click", () => leOpenProductModal(card.dataset.id));
  });
}

window.addEventListener("storage", (e) => {
  if(e.key === LE_WISHLIST_KEY) render();
});

render();
renderRecentlyViewed();
</script>
